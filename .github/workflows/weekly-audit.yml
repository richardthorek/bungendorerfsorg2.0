name: Weekly - Production Dependency Audit

# Re-runs the blocking audit gate from ci.yml against main every week.
# CI only audits on PR and push events, so an advisory published after a
# dependency last changed goes unnoticed until the next merge. This job does
# not deploy anything; it only reports.

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays 00:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Production dependency audit (root and api/)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit API production dependencies
        working-directory: api
        run: |
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=moderate
